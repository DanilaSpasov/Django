<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid p-0">
    <div class="row min-vh-100">

        <!-- SIDEBAR (Без изменений, чтобы сохранить единый стиль) -->
        <div class="col-2 bg-dark text-white d-flex flex-column min-vh-100 p-2">
            <div>
                <span class="d-flex align-items-center mb-3">
                    <img src="/app/static/images/logo.jpeg" width="80" height="40" class="me-2">
                    <span style="font-size:18px; font-weight:600;">Меню</span>
                </span>
                <button class="btn btn-dark w-100 text-start d-flex align-items-center mb-1"><img
                        src="/app/static/images/home.png" width="25" height="25" class="me-2"> Главная
                </button>
                <button class="btn btn-dark w-100 text-start d-flex align-items-center mb-1"><img
                        src="/app/static/images/catalog.jpg" width="25" height="25" class="me-2"> Каталог
                </button>
                <button class="btn btn-dark w-100 text-start d-flex align-items-center mb-1"><img
                        src="/app/static/images/category.jpg" width="25" height="25" class="me-2"> Категория 1
                </button>
                <button class="btn btn-dark w-100 text-start d-flex align-items-center active"><img
                        src="/app/static/images/contacts.png" width="25" height="25" class="me-2"> Контакты
                </button>
            </div>

            <div class="dropdown mt-auto">
                <button class="btn btn-secondary dropdown-toggle w-100 mb-2" type="button" data-bs-toggle="dropdown">
                    Пользователь
                </button>
                <ul class="dropdown-menu dropdown-menu-dark">
                    <li><a class="dropdown-item" href="#">Профиль</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" href="#">Выход</a></li>
                </ul>
            </div>
        </div>

        <!-- КОНТЕНТ (Контакты) -->
        <div class="col-10 p-3">
            <h1 class="text-center mt-4">Контакты</h1>

            <div class="row g-4 mt-4">

                <!-- ЛЕВАЯ КОЛОНКА: ФОРМА ЗАЯВКИ -->
                <div class="col-6">
                    <form>
                        <!-- Поле Email (оставляем как было, но меняем текст подсказки под контекст) -->
                        <div class="mb-3">
                            <label for="contactEmail" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="contactEmail"
                                   aria-describedby="emailHelp" placeholder="@exmaple.com">
                            <div id="emailHelp" class="form-text">Мы не передаем ваши данные третьим лицам.</div>
                        </div>
                        <div class="mb-3">
                            <label for="contactMessage" class="form-label">Ваше сообщение</label>
                            <textarea class="form-control" id="contactMessage" rows="3"
                                      placeholder="Расскажите подробнее о вашем вопросе..."></textarea>
                        </div>

                        <!-- Кнопка отправки -->
                        <button type="submit" class="btn btn-primary">Отправить заявку</button>
                    </form>
                </div>


                <!-- ПРАВАЯ КОЛОНКА: КОНТАКТЫ -->
                <div class="col-6">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-header bg-white py-3">
                            <h4 class="mb-0">Наши контакты</h4>
                        </div>
                        <div class="card-body p-0">
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    <span><strong>Адрес:</strong></span>
                                    <span>г. Москва</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    <span><strong>Телефон:</strong></span>
                                    <span><a href="tel:+79990000000" class="text-decoration-none link-primary fw-bold">+7 (999) 000-00-00</a></span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    <span><strong>Email:</strong></span>
                                    <span><a href="mailto:info@example.com"
                                             class="text-decoration-none link-primary fw-bold">info@example.com</a></span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    <span><strong>Часы работы:</strong></span>
                                    <span>Пн–Пт: 09:00–18:00<br>Сб–Вс: выходной</span>
                                </li>
                            </ul>
                        </div>

                        <!-- Блок соцсетей (опционально, тоже на Bootstrap) -->
                        <div class="card-footer bg-white border-top-0 text-center">
                            <small class="text-muted">Мы в соцсетях:</small>
                            <div class="btn-group mt-2" role="group">
                                <a href="#" class="btn btn-outline-primary btn-sm">Соцсеть 1</a>
                                <a href="#" class="btn btn-outline-primary btn-sm">Соцсеть 2</a>
                                <a href="#" class="btn btn-outline-primary btn-sm">Соцсеть 3</a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
